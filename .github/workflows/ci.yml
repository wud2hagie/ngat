name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip streamlit
      - name: Compile Python
        run: python -m compileall -q .
      - name: Validate question bank
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("questions.json")
          assert p.is_file(), "questions.json is missing"
          questions = json.loads(p.read_text(encoding="utf-8"))
          assert isinstance(questions, list) and questions
          for i, q in enumerate(questions, 1):
              assert isinstance(q.get("question"), str) and q["question"].strip(), f"Question {i}: missing prompt"
              opts = q.get("options")
              assert isinstance(opts, list) and len(opts) >= 2, f"Question {i}: invalid options"
              answer = q.get("answer")
              assert isinstance(answer, int) and 0 <= answer < len(opts), f"Question {i}: invalid answer index"
          print(f"Validated {len(questions)} questions")
          PY
